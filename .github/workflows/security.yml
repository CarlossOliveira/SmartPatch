name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
      jobs: ${{ steps.read.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: read
        working-directory: app
        run: node tooling/scripts/automationConfig.mjs github security

  secrets:
    needs: config
    if: needs.config.outputs.enabled == 'true' && fromJSON(needs.config.outputs.jobs).secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar segredos no histórico
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnscan:
    needs: config
    if: needs.config.outputs.enabled == 'true' && fromJSON(needs.config.outputs.jobs).vulnscan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar vulnerabilidades conhecidas nas dependências
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
